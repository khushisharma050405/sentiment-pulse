version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentiment-pulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sentiment_pulse.db
      - JWT_SECRET=sentiment-pulse-production-super-secret-key-change-me
      - JWT_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://localhost,http://127.0.0.1
      - AUTH_RATE_LIMIT=30
      - SENTIMENT_ENGINE=vader
    volumes:
      - backend-db:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sentiment-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - VITE_REQUIRE_AUTH=true
    container_name: sentiment-pulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentiment-network

volumes:
  backend-db:
    driver: local

networks:
  sentiment-network:
    driver: bridge
